name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Release binaries ship without debug symbols.
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          # J2534 v05.00 drivers are 32-bit DLLs, so the Windows binary must be
          # 32-bit as well. Cross-compiled with MinGW; every dependency is pure
          # Rust, so no vendor SDK is needed.
          - os: ubuntu-22.04
            target: i686-pc-windows-gnu
            archive: zip
            mingw: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install MinGW cross toolchain
        if: matrix.mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686

      - name: Build
        env:
          CARGO_TARGET_I686_PC_WINDOWS_GNU_LINKER: i686-w64-mingw32-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi

          name="opendiag-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          binary="target/${{ matrix.target }}/release/opendiag"
          if [ -f "${binary}.exe" ]; then
            binary="${binary}.exe"
          fi
          cp "${binary}" README.md LICENSE "dist/${name}/"

          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            archive="${name}.zip"
            zip -qr "${archive}" "${name}"
          else
            archive="${name}.tar.gz"
            tar -czf "${archive}" "${name}"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          echo "archive=${archive}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@v4
        with:
          name: opendiag-${{ matrix.target }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
          path: repo

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          prerelease=()
          case "${tag}" in *-*) prerelease=(--prerelease);; esac
          gh release create "${tag}" \
            --title "opendiag ${tag#v}" \
            --notes-file repo/.github/release-notes.md \
            --verify-tag \
            "${prerelease[@]}" \
            dist/*
